name: Suite Linters

on:
  schedule:
    - cron: "47 2 * * *"
  # //// Neoffice — on every push to version-15 too: upstream lints the pull requests only
  # //// (#950), but this fork pushes straight to version-15, so a file ruff format refused was
  # //// seen by the nightly run only, the morning after (an upstream merge on 17.10, a marker
  # //// commit on 21.10; neoffice-maintenance#1797). The marker bot pushes with [skip ci] and
  # //// stays silent; the frontend build bot's artifacts are left out below.
  push:
    branches: [version-15]
    paths:
      - "suite/**"
      - "frontend/**"
      - "e2e/**"
      - "package.json"
      - "yarn.lock"
      - "knip.json"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/suite-linter.yml"
      - "!suite/public/frontend/**"
      - "!suite/www/suite.html"
      - "!suite/www/event_rsvp.html"
      - "!suite/www/service-worker.js"
  pull_request:
    paths:
      - "suite/**"
      - "frontend/**"
      - "e2e/**"
      - "package.json"
      - "yarn.lock"
      - "knip.json"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/suite-linter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: Frappe Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep scan --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness .

  python-checks:
    name: Ruff Format and Vulnerable Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install Ruff
        run: pip install ruff==0.12.3

      - name: Test CI scripts
        run: python -m unittest discover .github/scripts -p 'test_*.py'

      - name: Check formatting
        run: ruff format --check .

      # Existing lint findings make this evidence-only until the baseline is clean.
      - name: Check lint baseline
        continue-on-error: true
        run: |
          ruff check .

      - name: Install and run pip-audit
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit
          pip-audit --desc on .

  javascript-health:
    name: JavaScript Health Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Existing findings make these evidence-only until their baselines are clean.
      - name: Check frontend dead code
        continue-on-error: true
        run: yarn knip:frontend

      - name: Check E2E dead code
        continue-on-error: true
        run: yarn knip:e2e

      - name: Check SFU dead code
        continue-on-error: true
        run: yarn knip:sfu-server

      - name: Check Sheets collaboration dead code
        continue-on-error: true
        run: yarn knip:sheets-collab

      - name: Audit production dependencies
        continue-on-error: true
        run: |
          mkdir -p test-results
          status=0
          yarn audit --groups dependencies --level high 2>&1 | tee test-results/yarn-audit.txt || status=1
          yarn --cwd suite/meet/sfu-server audit --groups dependencies --level high 2>&1 | tee -a test-results/yarn-audit.txt || status=1
          yarn --cwd suite/meet/recorder-server audit --groups dependencies --level high 2>&1 | tee -a test-results/yarn-audit.txt || status=1
          exit "$status"

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-javascript-health
          path: test-results/yarn-audit.txt
          if-no-files-found: warn
          retention-days: 30
