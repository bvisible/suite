<!-- //// Neoffice — added file (no upstream equivalent): the Settings tile in the apps_v2 style of neoffice_theme (same template as its meet.svg, Lucide's gear), which has no settings icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Settings">
  <defs>
    <style>
    .icon-bg { transform-box: fill-box; transform-origin: center; animation: neo-breathe 5.6s ease-in-out infinite; }
    .soft-light { transform-box: fill-box; transform-origin: center; animation: neo-drift 7.4s ease-in-out infinite; }
    .glyph { color: white; animation: neo-glyph-glow 4.8s ease-in-out infinite; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: neo-twinkle 3.2s ease-in-out infinite; }
    .orbit-dot { transform-origin: 512px 512px; animation: neo-orbit 7s linear infinite; }
    @keyframes neo-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.014); } }
    @keyframes neo-drift { 0%, 100% { opacity: .54; transform: translate(-18px, -10px) scale(1); } 50% { opacity: .78; transform: translate(18px, 12px) scale(1.035); } }
    @keyframes neo-glyph-glow { 0%, 100% { opacity: .92; } 50% { opacity: 1; } }
    @keyframes neo-twinkle { 0%, 100% { opacity: .72; transform: scale(.92) rotate(0deg); } 50% { opacity: 1; transform: scale(1.08) rotate(8deg); } }
    @keyframes neo-orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon-bg, .soft-light, .glyph, .sparkle, .orbit-dot { animation: none; } }
  </style>
    <linearGradient id="neo-settings-bg" x1="162" y1="60" x2="868" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#80838C"/>
      <stop offset=".58" stop-color="#686B73"/>
      <stop offset="1" stop-color="#86888D"/>
    </linearGradient>
    <radialGradient id="neo-settings-pulse" cx="33%" cy="24%" r="64%">
      <stop offset="0" stop-color="#C9D3E2" stop-opacity=".36"/>
      <stop offset=".54" stop-color="#C9D3E2" stop-opacity=".08"/>
      <stop offset="1" stop-color="#C9D3E2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neo-settings-soft-light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset=".46" stop-color="#C9D3E2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C9D3E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="neo-settings-shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect class="icon-bg" width="1024" height="1024" rx="238" fill="url(#neo-settings-bg)"/>
  <rect width="1024" height="1024" rx="238" fill="url(#neo-settings-pulse)"/>
  <g class="soft-light" opacity=".62">
    <circle cx="356" cy="310" r="214" fill="url(#neo-settings-soft-light)"/>
    <circle cx="690" cy="604" r="180" fill="#C9D3E2" opacity=".07"/>
  </g>
  <g opacity=".11" stroke="white" stroke-width="2">
    <path d="M174 256H850"/><path d="M174 512H850"/><path d="M174 768H850"/>
    <path d="M256 174V850"/><path d="M512 174V850"/><path d="M768 174V850"/>
  </g>
  <circle cx="512" cy="512" r="264" fill="white" opacity=".055"/>
  <circle cx="512" cy="512" r="261" fill="none" stroke="white" stroke-opacity=".16" stroke-width="3"/>
  <circle class="orbit-dot" cx="512" cy="238" r="10" fill="#C9D3E2" opacity=".9"/>
  <g class="glyph" transform="translate(252 252) scale(21.6666667)" filter="url(#neo-settings-shadow)" color="white">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  
    <g class="sparkle" fill="white">
      <path d="M770 142L792 198L848 220L792 242L770 298L748 242L692 220L748 198Z" opacity=".92"/>
      <circle cx="860" cy="164" r="11" opacity=".5"/>
      <circle cx="704" cy="318" r="8" opacity=".38"/>
    </g>
</svg>