<!DOCTYPE html>
<!-- //// Neoffice — lang comes from the page context (www/suite.py), the user's language, not a fixed "en" (#1316). -->
<html
  lang="{{ lang or 'en' }}"
  data-theme-mode="{{ desk_theme.lower() if desk_theme else 'light' }}"
  data-theme="{{ desk_theme.lower() if desk_theme else 'light' }}"
>
  <head>
    <script>
      if (document.documentElement.dataset.theme === 'automatic') {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <meta charset="UTF-8" />
    <!-- //// Neoffice — Neoffice's name and icon before any script runs (the router then sets each app's own): upstream showed « Frappe Suite » and its mark. -->
    <title>Neoffice</title>
    <link rel="icon" type="image/png" href="/assets/neoffice_theme/images/neoffice_icon.png" />
    <!-- viewport-fit=cover: draw edge-to-edge in iOS standalone — required for the
         env(safe-area-inset-*) paddings to be non-zero at all.

         interactive-widget=resizes-content: the on-screen keyboard shrinks the layout viewport
         instead of leaving it full-height and sliding the visible part around underneath. Without
         it a full-screen pane runs on under the keyboard, and iOS pans the whole page to reveal a
         focused field — the compose sheet jumping on every focus change. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Status-bar/browser-chrome color; kept in sync with the active scheme at
         runtime (see mail's MailLayout) so the bar never sits white over a dark app. -->
    <meta
      name="theme-color"
      content="{{ '#171717' if desk_theme and desk_theme.lower() == 'dark' else '#ffffff' }}"
    />
    <!-- No manifest / standalone metas here on purpose: this shell is shared by
